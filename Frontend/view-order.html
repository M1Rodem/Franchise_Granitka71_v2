<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр заказа - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/orders.css">
    <link rel="stylesheet" href="CSS/photos.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Дашборд</a>
            <a href="orders.html" class="nav-item active">Заказы</a>
            <a href="create-order.html" class="nav-item">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item">Архив</a>
            <a href="users.html" class="nav-item admin-only" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Просмотр заказа</h1>
                <a href="orders.html" class="btn btn-outline back-btn">← Назад</a>
            </div>

            <div id="loadingSpinner" class="loading-spinner" role="status" aria-live="polite">Загрузка...</div>

            <div id="orderContainer" class="order-container" role="region" aria-label="Детали заказа">
                <!-- Основные детали (рендерятся в #orderView) -->
                <div id="orderView" class="order-view card" aria-labelledby="order-header">
                    <!-- JS вставит сюда детали заказа -->
                </div>

                <!-- Работы (accordion для компактности и мобильности) -->
                <details class="accordion-section" open>
                    <summary class="accordion-summary">Работы по заказу</summary>
                    <div id="workItemsContainer" class="section-content no-data" role="region" aria-label="Список работ">
                        Нет работ
                    </div>
                </details>

                <!-- Платежи -->
                <details class="accordion-section" open>
                    <summary class="accordion-summary">Платежи</summary>
                    <div id="paymentsContainer" class="section-content no-data" role="region" aria-label="Список платежей">
                        Нет платежей
                    </div>
                </details>

                <!-- Фото (открыто по умолчанию) -->
                <details class="accordion-section photo-accordion" open>
                    <summary class="accordion-summary">Фотографии</summary>
                    <div id="orderPhotos" class="photo-preview section-content" role="region" aria-label="Галерея фотографий">
                        Нет фотографий
                    </div>
                </details>

                <div class="action-buttons">
                    <button id="editBtn" class="btn btn-primary" aria-label="Редактировать заказ">Редактировать</button>
                    <button id="deleteBtn" class="btn btn-danger" aria-label="Удалить заказ">Удалить</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно для просмотра фото (CSS-классы для анимации и стилей) -->
    <div id="photoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalCaption" tabindex="-1">
        <div class="modal-overlay" aria-label="Закрыть модальное окно" data-close-modal></div>
        <div class="modal-content">
            <button class="modal-close" aria-label="Закрыть" data-close-modal>&times;</button>
            <img id="modalImage" src="" alt="" class="modal-image" loading="lazy">
            <div id="modalCaption" class="modal-caption"></div>
            <button id="modalDownload" class="btn btn-outline btn-download" aria-label="Скачать фото">Скачать</button>
        </div>
    </div>

    <script type="module" src="js/view-order.js"></script>
</body>
</html>
