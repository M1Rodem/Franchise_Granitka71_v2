<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Granitka71</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="CSS/base/reset.css">
    <link rel="stylesheet" href="CSS/base/variables.css">
    <link rel="stylesheet" href="CSS/base/utilities.css">
    
    <!-- Layout -->
    <link rel="stylesheet" href="CSS/layout/header.css">
    <link rel="stylesheet" href="CSS/layout/sidebar.css">
    <link rel="stylesheet" href="CSS/layout/main-content.css">
    
    <!-- Components -->
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/forms.css">
    <link rel="stylesheet" href="CSS/components/tables.css">
    <link rel="stylesheet" href="CSS/components/cards.css">
    <link rel="stylesheet" href="CSS/components/modals.css">
    
    <!-- Pages -->
    <link rel="stylesheet" href="CSS/pages/profile.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <button id="burgerBtn" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">
                    ☰
                </button>
                <h1>Granitka71</h1>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти из аккаунта">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item" data-page="orders">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="users.html" class="nav-item admin-only" data-page="users" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <div class="page-header">
                <h1>Профиль пользователя</h1>
                <a href="dashboard.html" class="btn btn-outline">← Назад в дашборд</a>
            </div>

            <!-- Информация профиля -->
            <div class="card profile-section">
                <h2>Основная информация</h2>
                <div class="profile-info-grid">
                    <div class="form-group">
                        <label for="username">Логин</label>
                        <input id="username" type="text" readonly class="readonly-field">
                        <small>Логин нельзя изменить</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="fullName">ФИО</label>
                        <input id="fullName" type="text" placeholder="Введите ваше полное имя">
                    </div>
                    
                    <div class="form-group">
                        <label for="role">Роль</label>
                        <input id="role" type="text" readonly class="readonly-field">
                        <small>Роль назначается администратором</small>
                    </div>
                </div>
                <button id="updateProfileBtn" class="btn btn-primary">Сохранить изменения</button>
            </div>

            <!-- Смена пароля -->
            <div class="card profile-section">
                <h2>Смена пароля</h2>
                <form id="changePasswordForm">
                    <input type="text" name="username" autocomplete="username" style="display: none;">
                    
                    <div class="form-group">
                        <label for="currentPassword">Текущий пароль</label>
                        <input id="currentPassword" type="password" placeholder="Введите текущий пароль" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Новый пароль</label>
                        <input id="newPassword" type="password" placeholder="Новый пароль (минимум 6 символов)" autocomplete="new-password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Подтверждение пароля</label>
                        <input id="confirmPassword" type="password" placeholder="Повторите новый пароль" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Сменить пароль</button>
                </form>
            </div>

            <!-- Сообщения -->
            <div id="profileError" class="error-message" style="display: none;"></div>
            <div id="profileSuccess" class="success-message" style="display: none;"></div>
        </div>
    </main>

    <script type="module">
        import { SidebarManager } from './js/sidebar-manager.js';
        import { PageManager } from './js/page-manager.js';
        
        // Инициализируем sidebar после загрузки DOM
        document.addEventListener('DOMContentLoaded', () => {
            SidebarManager.init();
            PageManager.initialize('profile');
        });
    </script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
