<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи - Granitka71</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="./CSS/base/reset.css">
    <link rel="stylesheet" href="./CSS/base/variables.css">
    <link rel="stylesheet" href="./CSS/base/utilities.css">
    <link rel="stylesheet" href="./CSS/base/typography.css">
    
    <!-- Layout -->
    <link rel="stylesheet" href="./CSS/layout/header.css">
    <link rel="stylesheet" href="./CSS/layout/sidebar.css">
    <link rel="stylesheet" href="./CSS/layout/main-content.css">
    
    <!-- Components -->
    <link rel="stylesheet" href="./CSS/components/buttons.css">
    <link rel="stylesheet" href="./CSS/components/forms.css">
    <link rel="stylesheet" href="./CSS/components/tables.css">
    <link rel="stylesheet" href="./CSS/components/cards.css">
    <link rel="stylesheet" href="./CSS/components/modals.css">
    <link rel="stylesheet" href="./CSS/components/toasts.css">
    <link rel="stylesheet" href="./CSS/components/loading.css">
    
    <!-- Pages -->
    <link rel="stylesheet" href="./CSS/pages/users.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <button id="burgerBtn" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">
                    ☰
                </button>
                <h1>Granitka71</h1>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти из аккаунта">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item" data-page="orders">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="users.html" class="nav-item active admin-only" data-page="users" aria-current="page">Пользователи</a>
        </div>
    </nav>

    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <div class="page-header">
                <h1>Управление пользователями</h1>
                <div class="page-header-actions">
                    <button id="createUserBtn" class="btn btn-primary">+ Создать пользователя</button>
                    <a href="dashboard.html" class="btn btn-outline">← Назад в дашборд</a>
                </div>
            </div>

            <!-- Фильтры и поиск -->
            <div class="filters">
                <div class="search-group">
                    <input type="text" id="searchInput" class="search-input" 
                           placeholder="Поиск по ID, логину, ФИО...">
                </div>
                <button id="resetFilters" class="btn btn-outline">Сбросить</button>
            </div>

            <!-- Таблица пользователей -->
            <div class="orders-table-container">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>ФИО</th>
                            <th>Роль</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Данные загружаются через JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <div class="pagination">
                <button id="prevPage" class="btn btn-outline">← Назад</button>
                <span id="pageInfo">Страница 1 из 1</span>
                <button id="nextPage" class="btn btn-outline">Вперед →</button>
            </div>
        </div>
    </main>

    <!-- Модальное окно создания пользователя -->
    <div id="createUserModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="createUserModalTitle" tabindex="-1">
        <div class="modal-content glass-modal" style="max-width: 450px; width: 95%;">
            <button class="modal-close" data-close-modal>&times;</button>
            
            <div class="modal-header">
                <h3 id="createUserModalTitle" class="modal-title">Создать пользователя</h3>
            </div>
            
            <form id="createUserForm" class="modal-form">
                <div class="form-group">
                    <label for="createUsername">Логин *</label>
                    <input type="text" id="createUsername" required placeholder="username" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="createPassword">Пароль *</label>
                    <input type="password" id="createPassword" required placeholder="минимум 6 символов" minlength="6" autocomplete="new-password">
                </div>
                
                <div class="form-group">
                    <label for="createFullName">ФИО *</label>
                    <input type="text" id="createFullName" required placeholder="ФИО" autocomplete="name">
                </div>
                
                <div class="form-group">
                    <label for="createRole">Роль *</label>
                    <select id="createRole" required>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно редактирования пользователя -->
    <div id="editUserModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editUserModalTitle" tabindex="-1">
        <div class="modal-content glass-modal" style="max-width: 450px; width: 95%;">
            <button class="modal-close" data-close-modal>&times;</button>
            
            <div class="modal-header">
                <h3 id="editUserModalTitle" class="modal-title">Редактировать пользователя</h3>
            </div>
            
            <form id="editUserForm" class="modal-form">
                <div class="form-group">
                    <label for="editUsername">Логин *</label>
                    <input type="text" id="editUsername" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="editFullName">ФИО *</label>
                    <input type="text" id="editFullName" required autocomplete="name">
                </div>
                
                <div class="form-group">
                    <label for="editPassword">Новый пароль</label>
                    <input type="password" id="editPassword" placeholder="Оставьте пустым, чтобы не менять" autocomplete="new-password" minlength="6">
                    <small>Минимум 8 символов</small>
                </div>
                
                <div class="form-group">
                    <label>Текущая роль: <span id="currentRole" class="role-badge"></span></label>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { SidebarManager } from './js/core/sidebar-manager.js';
        import { PageManager } from './js/core/page-manager.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            SidebarManager.init();
            PageManager.initialize('page-name');
        });
    </script>
    <script type="module" src="./js/pages/users.js"></script>
</body>
</html>
