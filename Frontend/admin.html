<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Granitka71</title>
    
    <link rel="stylesheet" href="./CSS/base/reset.css">
    <link rel="stylesheet" href="./CSS/base/variables.css">
    <link rel="stylesheet" href="./CSS/base/utilities.css">
    <link rel="stylesheet" href="./CSS/base/typography.css">
    
    <link rel="stylesheet" href="./CSS/layout/header.css">
    <link rel="stylesheet" href="./CSS/layout/sidebar.css">
    <link rel="stylesheet" href="./CSS/layout/main-content.css">
    
    <link rel="stylesheet" href="./CSS/components/buttons.css">
    <link rel="stylesheet" href="./CSS/components/cards.css">
    
    <link rel="stylesheet" href="./CSS/pages/admin.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <button id="burgerBtn" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">☰</button>
                <a href="dashboard.html"><h1>Granitka71</h1></a>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item" data-page="orders">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="notifications.html" class="nav-item" data-page="notifications">
                Уведомления <span id="notificationsBadge" class="badge" style="display: none;">0</span>
            </a>
            <a href="admin.html" class="nav-item admin-only active" data-page="admin" style="display: none;">Админ-панель</a>
        </div>
    </nav>
    
    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <div class="page-header">
                <h1>Админ-панель</h1>
                <a href="dashboard.html" class="btn btn-outline">← Назад в дашборд</a>
            </div>

            <div class="admin-cards-grid">
                <a href="users.html" class="admin-card">
                    <h3>Пользователи</h3>
                    <p>Управление пользователями системы</p>
                </a>
                
                <a href="admin/plot.html" class="admin-card">
                    <h3>Добавить место</h3>
                    <p>Создание нового участка / площадки</p>
                </a>
            </div>
        </div>
    </main>

    <script type="module">
        import { SidebarManager } from './js/core/sidebar-manager.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            SidebarManager.init();
        });
    </script>
</body>
</html>
