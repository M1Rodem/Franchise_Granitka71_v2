<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <span id="userName">Пользователь</span>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item active">
                📊 Дашборд
            </a>
            <a href="orders.html" class="nav-item">
                📋 Заказы
            </a>
            <a href="create-order.html" class="nav-item">
                ➕ Создать заказ
            </a>
            <a href="archived-orders.html" class="nav-item">🗑️ Архив</a>
            <a href="users.html" class="nav-item admin-only" style="display: none;">
                👥 Пользователи
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>Всего заказов</h3>
                    <div class="stat-number" id="totalOrders">0</div>
                </div>
                <div class="stat-card">
                    <h3>Неоплаченные</h3>
                    <div class="stat-number" id="unpaidOrders">0</div>
                </div>
                <div class="stat-card">
                    <h3>За сегодня</h3>
                    <div class="stat-number" id="todayOrders">0</div>
                </div>
            </div>

            <div class="recent-orders">
                <h2>Последние заказы</h2>
                <div id="recentOrdersList" class="orders-list">
                    <!-- Список заказов будет здесь -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
