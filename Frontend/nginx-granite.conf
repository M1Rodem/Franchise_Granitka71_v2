server {
    listen 80;
    server_name granit71.ru www.granit71.ru;
    
    # РЕДИРЕКТ HTTP → HTTPS (раскомментировать после настройки SSL)
    # return 301 https://$server_name$request_uri;
    
    # Frontend - статические файлы из сборки Vue
    location / {
        root /var/www/granite/wwwroot;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты для загрузки файлов
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
    
    # Статические файлы загрузок (фото и т.д.)
    location /uploads/ {
        alias /var/www/granite/wwwroot/uploads/;
        expires 1h;
        add_header Cache-Control "public";
        
        # Безопасность - запрет выполнения скриптов в папке uploads
        location ~* \.(php|asp|aspx|jsp)$ {
            deny all;
        }
    }
    
    # Кэширование статических файлов фронтенда
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/granite/wwwroot;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Блокировка скрытых файлов
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Блокировка敏感 файлов
    location ~* (\.env|\.git|composer\.json|package\.json) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

