<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Granitka71</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="./CSS/base/reset.css">
    <link rel="stylesheet" href="./CSS/base/variables.css">
    <link rel="stylesheet" href="./CSS/base/utilities.css">
    
    <!-- Layout -->
    <link rel="stylesheet" href="./CSS/layout/header.css">
    <link rel="stylesheet" href="./CSS/layout/sidebar.css">
    <link rel="stylesheet" href="./CSS/layout/main-content.css">
    
    <!-- Components -->
    <link rel="stylesheet" href="./CSS/components/buttons.css">
    <link rel="stylesheet" href="./CSS/components/forms.css">
    <link rel="stylesheet" href="./CSS/components/tables.css">
    <link rel="stylesheet" href="./CSS/components/cards.css">
    <link rel="stylesheet" href="./CSS/components/modals.css">
    
    <!-- Pages -->
    <link rel="stylesheet" href="./CSS/pages/orders.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <button id="burgerBtn" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">
                    ☰
                </button>
                <h1>Granitka71</h1>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти из аккаунта">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item active" data-page="orders" aria-current="page">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="users.html" class="nav-item admin-only" data-page="users" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <div class="page-header">
                <h1>Управление заказами</h1>
                <div class="page-header-actions">
                    <a href="create-order.html" class="btn btn-primary">Создать заказ</a>
                </div>
            </div>

            <!-- Фильтры -->
            <div class="filters">
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск по номеру, ФИО, телефону...">
                
                <select id="statusFilter" class="statusFilter">
                    <option value="all">Все статусы</option>
                    <option value="not_paid">Не оплачен</option>
                    <option value="partial">Частично оплачен</option>
                    <option value="paid">Оплачен</option>
                    <option value="overpaid">Переплачен</option>
                </select>
                
                <div class="date-range">
                    <div class="date-group">
                        <label for="dateFrom">От:</label>
                        <input type="date" id="dateFrom" class="date-field">
                    </div>
                    <div class="date-group">
                        <label for="dateTo">До:</label>
                        <input type="date" id="dateTo" class="date-field">
                    </div>
                </div>
                
                <button id="applyFilters" class="btn btn-primary">Применить</button>
                <button id="resetFilters" class="btn btn-outline">Сбросить</button>
            </div>

            <!-- Таблица заказов -->
            <div class="orders-table-container">
                <table class="orders-table" id="ordersTable">
                    <thead>
                        <tr>
                            <th>№ Заказа</th>
                            <th>Клиент</th>
                            <th>Телефон</th>
                            <th>Дата</th>
                            <th>Сумма</th>
                            <th>Статус оплаты</th>
                            <th>Менеджер</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Данные загружаются через JS -->
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <div class="pagination">
                <button id="prevPage" class="btn btn-outline" disabled>← Назад</button>
                <span id="pageInfo">Страница 1 из 1</span>
                <button id="nextPage" class="btn btn-outline" disabled>Вперед →</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { SidebarManager } from './js/core/sidebar-manager.js';
        import { PageManager } from './js/core/page-manager.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            SidebarManager.init();
            PageManager.initialize('page-name');
        });
    </script>
    <script type="module" src="./js/pages/orders.js"></script>
</body>
</html>
