<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/orders.css">
    <link rel="stylesheet" href="CSS/modals.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <span id="userName">Пользователь</span>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Дашборд</a>
            <a href="orders.html" class="nav-item">Заказы</a>
            <a href="create-order.html" class="nav-item">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item">Архив</a>
            <a href="users.html" class="nav-item admin-only" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Профиль пользователя</h1>
                <a href="dashboard.html" class="btn btn-outline">← Назад в дашборд</a>
            </div>

            <!-- Информация профиля -->
            <div class="card profile-section">
                <h2>Основная информация</h2>
                <div class="profile-info-grid">
                    <div class="form-group">
                        <label for="username">Логин</label>
                        <input id="username" type="text" readonly class="readonly-field">
                        <small>Логин нельзя изменить</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="fullName">ФИО</label>
                        <input id="fullName" type="text" placeholder="Введите ваше полное имя">
                    </div>
                    
                    <div class="form-group">
                        <label for="role">Роль</label>
                        <input id="role" type="text" readonly class="readonly-field">
                        <small>Роль назначается администратором</small>
                    </div>
                </div>
                <button id="updateProfileBtn" class="btn btn-primary">Сохранить изменения</button>
            </div>

            <!-- Смена пароля -->
            <div class="card profile-section">
                <h2>Смена пароля</h2>
                <form id="changePasswordForm">
                    <input type="text" name="username" autocomplete="username" style="display: none;">
                    
                    <div class="form-group">
                        <label for="currentPassword">Текущий пароль</label>
                        <input id="currentPassword" type="password" placeholder="Введите текущий пароль" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Новый пароль</label>
                        <input id="newPassword" type="password" placeholder="Новый пароль (минимум 6 символов)" autocomplete="new-password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Подтверждение пароля</label>
                        <input id="confirmPassword" type="password" placeholder="Повторите новый пароль" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Сменить пароль</button>
                </form>
            </div>

            <!-- Сообщения -->
            <div id="profileError" class="error-message" style="display: none;"></div>
            <div id="profileSuccess" class="success-message" style="display: none;"></div>
        </div>
    </main>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
