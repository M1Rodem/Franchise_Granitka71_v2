<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/orders.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Дашборд</a>
            <a href="orders.html" class="nav-item active">Заказы</a>
            <a href="create-order.html" class="nav-item">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item">Архив</a>
            <a href="users.html" class="nav-item admin-only" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Управление заказами</h1>
                <a href="create-order.html" class="btn btn-primary">Новый заказ</a>
            </div>

            <!-- Фильтры -->
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Поиск по номеру, имени, телефону..." class="search-input">
                <select id="statusFilter" class="filter-select">
                    <option value="all">Все статусы</option>
                    <option value="not_paid">Не оплачено</option>
                    <option value="partial">Частично оплачено</option>
                    <option value="paid">Оплачено</option>
                </select>
                <button id="applyFilters" class="btn btn-primary">Применить</button>
                <button id="resetFilters" class="btn btn-outline">Сбросить</button>
            </div>

            <!-- Таблица заказов -->
            <div class="orders-table-container">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>№ Заказа</th>
                            <th>Клиент</th>
                            <th>Телефон</th>
                            <th>Дата</th>
                            <th>Сумма</th>
                            <th>Статус оплаты</th>
                            <th>Менеджер</th>  <!-- П.1 -->
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Заказы будут здесь -->
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <div class="pagination">
                <button id="prevPage" class="btn btn-outline">← Назад</button>
                <span id="pageInfo">Страница 1</span>
                <button id="nextPage" class="btn btn-outline">Вперед →</button>
            </div>
        </div>
    </main>

    <script type="module" src="js/orders.js"></script>
</body>
</html>
