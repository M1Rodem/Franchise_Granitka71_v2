<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи - Granitka71</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/orders.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <span id="userName">Пользователь</span>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                📊 Дашборд
            </a>
            <a href="orders.html" class="nav-item">
                📋 Заказы
            </a>
            <a href="create-order.html" class="nav-item">
                ➕ Создать заказ
            </a>
            <a href="archived-orders.html" class="nav-item">🗑️ Архив</a>
            <a href="users.html" class="nav-item active admin-only" style="display: none;">
                👥 Пользователи
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Пользователи</h1>
                <div></div>
            </div>

            <div class="card" style="padding: 1rem; margin-bottom: 1rem;">
                <h3 style="margin-bottom: 0.75rem;">Создать пользователя</h3>
                <form id="createUserForm">
                    <div class="form-group">
                        <label for="newUsername">Логин *</label>
                        <input type="text" id="newUsername" required placeholder="username">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Пароль *</label>
                        <input type="password" id="newPassword" required placeholder="минимум 6 символов" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="newFullName">ФИО *</label>
                        <input type="text" id="newFullName" required placeholder="ФИО">
                    </div>
                    <div class="form-group">
                        <label for="newRole">Роль *</label>
                        <select id="newRole" required>
                            <option value="Manager">Manager</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Создать</button>
                    <div id="userFormError" class="error-message"></div>
                    <div id="userFormSuccess" class="success-message"></div>
                </form>
            </div>

            <div class="orders-table-container">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>ФИО</th>
                            <th>Роль</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Пользователи будут здесь -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/users.js"></script>
    <script>
        // Скрыть страницу для не-админов
        (function(){
            const userData = JSON.parse(localStorage.getItem('userData') || '{}');
            if (userData.role !== 'Admin') {
                window.location.href = 'dashboard.html';
            }
        })();
    </script>
</body>
</html>
