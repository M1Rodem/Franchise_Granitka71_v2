<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр заказа - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/orders.css">
    <link rel="stylesheet" href="CSS/photos.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <span id="userName">Пользователь</span>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">📊 Дашборд</a>
            <a href="orders.html" class="nav-item active">📋 Заказы</a>
            <a href="create-order.html" class="nav-item">➕ Создать заказ</a>
            <a href="archived-orders.html" class="nav-item">🗑️ Архив</a>
            <a href="users.html" class="nav-item admin-only" style="display:none;">👥 Пользователи</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Просмотр заказа</h1>
                <a href="orders.html" class="btn btn-outline">← Назад</a>
            </div>

            <div id="orderView" class="card" style="padding:1rem;">
                Загрузка...
            </div>

            <!-- Секция фотографий (ТОЛЬКО ПРОСМОТР) -->
            <div class="card photo-section" style="padding:1rem; margin-top:1rem;">
                <h3>Фотографии</h3>
                
                <div id="orderPhotos" class="photo-preview">
                    Загрузка фотографий...
                </div>
                
                <!-- 🔥 УБРАЛИ КНОПКУ ДОБАВЛЕНИЯ ФОТО И ОБЛАСТЬ ЗАГРУЗКИ -->
            </div>

            <div style="margin-top:1rem;">
                <button id="editBtn" class="btn btn-primary">Редактировать</button>
                <button id="deleteBtn" class="btn btn-danger">Удалить</button>
            </div>
        </div>
    </main>

    <!-- Модальное окно для просмотра фото -->
    <div id="photoModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="Фото заказа" style="max-width:100%; max-height:80vh;">
            <div id="modalCaption"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/photo-utils.js"></script>
    <script src="js/modal-utils.js"></script>
    <script src="js/view-order.js"></script>
</body>
</html>
