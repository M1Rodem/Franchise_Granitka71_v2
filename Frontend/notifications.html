<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уведомления | Система управления заказами</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="CSS/base/reset.css">
    <link rel="stylesheet" href="CSS/base/variables.css">
    <link rel="stylesheet" href="CSS/base/utilities.css">
    <link rel="stylesheet" href="CSS/base/typography.css">
    
    <!-- Layout -->
    <link rel="stylesheet" href="CSS/layout/header.css">
    <link rel="stylesheet" href="CSS/layout/sidebar.css">
    <link rel="stylesheet" href="CSS/layout/main-content.css">
    
    <!-- Components -->
    <link rel="stylesheet" href="CSS/components/map.css">
    <link rel="stylesheet" href="CSS/components/media.css">
    <link rel="stylesheet" href="./JS/notification/notification-fix-photo.css">
    <link rel="stylesheet" href="./JS/notification/notification-fix.css">
    <link rel="stylesheet" href="CSS/components/modals.css">
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/forms.css">
    <link rel="stylesheet" href="CSS/components/tables.css">
    <link rel="stylesheet" href="CSS/components/cards.css">
    <link rel="stylesheet" href="CSS/components/toasts.css">
    <link rel="stylesheet" href="CSS/components/loading.css">
    
    <!-- Pages -->
    <link rel="stylesheet" href="CSS/pages/notifications.css">
    
    <style>
        /* Дополнительные стили для уведомлений */
        .connection-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 9999;
            opacity: 0.8;
            display: none;
        }
        
        .connection-status.connected {
            background-color: var(--success-color);
            color: white;
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <button id="burgerBtn" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">
                    ☰
                </button>
                <a href="dashboard.html"><h1>Granitka71</h1></a>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти из аккаунта">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item" data-page="orders">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="notifications.html" class="nav-item" data-page="notifications">
                Уведомления&nbsp;
                <span id="notificationsBadge" class="badge" style="display: none;">0</span>
            </a>
            <a href="admin.html" class="nav-item admin-only" data-page="admin" style="display: none;">Админ-панель</a>
        </div>
    </nav>

    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <!-- Заголовок страницы -->
            <div class="page-header glass-background glass-shadow border radius-xl slideInDown">
                <div class="page-header-content">
                    <div class="page-header-title">
                        <h1 id="pageTitle" class="text-shadow">Уведомления</h1>
                    </div>
                    
                    <div class="page-header-actions">
                        <!-- Фильтры -->
                        <div class="filters glass-background glass-shadow border radius-xl fadeInUp">
                            <div class="filter-content">
                                <div class="filter-buttons">
                                    <button id="filterActive" class="btn btn-outline filter-btn active" data-filter="active">
                                        Активные
                                        <span id="activeCount" class="badge badge-danger">0</span>
                                    </button>
                                    <button id="filterPostponed" class="btn btn-outline filter-btn" data-filter="postponed">
                                        Отложенные
                                        <span id="postponedCount" class="badge">0</span>
                                    </button>
                                    <button id="filterHistory" class="btn btn-outline filter-btn" data-filter="history">
                                        История
                                        <span id="historyCount" class="badge">0</span>
                                    </button>
                                </div>
                                
                                <div class="filter-actions">
                                    <button id="refreshBtn" class="btn btn-outline btn-small" title="Обновить список">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.1-6.3M22 12.5a10 10 0 0 1-18.1 6.2"/>
                                        </svg>
                                        Обновить
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Индикатор состояния SignalR -->
            <div id="signalrStatus" class="connection-status">
                <span id="statusText">Проверка...</span>
            </div>

            <!-- Основной контейнер для уведомлений -->
            <div id="notificationsContainer" class="orders-table-container glass-background glass-shadow border radius-xl fadeInUp">
                <div class="table-header">
                    <h2 id="notifications-heading" class="sr-only">Список уведомлений</h2>
                </div>
                
                <!-- Состояние загрузки -->
                <div id="loadingContainer" class="loading-container">
                    <div class="spinner spinner-lg"></div>
                    <p class="text-muted">Загрузка уведомлений...</p>
                </div>
                
                <!-- Список уведомлений -->
                <div id="notificationsList" class="notifications-grid"></div>
            </div>

            <!-- Пагинация -->
            <div id="paginationContainer" class="pagination-container" style="display: none;">
                <div class="pagination-info">
                    <span id="paginationInfo">Страница 1 из 1</span>
                </div>
                <div class="pagination-controls">
                    <button id="prevPage" class="btn btn-outline" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                        Назад
                    </button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button id="nextPage" class="btn btn-outline">
                        Вперед
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно деталей уведомления -->
    <div id="notificationDetailsModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content glass-modal" style="max-width: 900px;">
            <div class="modal-header glass-background">
                <h3 id="modalDetailsTitle" class="modal-title">Детали уведомления</h3>
                <button class="modal-close" data-close-modal aria-label="Закрыть">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="orders-table-container glass-background">               
                    <div id="notificationDetailsContent" class="p-5">
                        <!-- Контент будет добавлен JS -->
                    </div>
                </div>
            </div>
            
            <div class="modal-footer glass-background">
                <div class="notification-action-buttons">
                    <button id="rejectBtn" class="btn btn-danger" data-action="reject">Отклонить</button>
                    <button id="postponeBtn" class="btn btn-outline" data-action="postpone">Отложить</button>
                    <button id="approveBtn" class="btn btn-primary" data-action="approve">Принять</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно откладывания -->
    <div id="postponeModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="postponeModalTitle" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 id="postponeModalTitle">Отложить уведомление</h3>
                <button class="modal-close" data-close-modal aria-label="Закрыть">×</button>
            </div>
            <div class="modal-body">
                <form id="postponeForm">
                    <div class="form-group">
                        <label for="postponeMinutes">На сколько минут отложить?</label>
                        <input type="number" id="postponeMinutes" class="form-control" 
                               min="1" max="1440" value="30" required>
                        <small>От 1 до 1440 минут (24 часа)</small>
                    </div>
                    <div class="form-group">
                        <label for="postponeReason">Причина (необязательно)</label>
                        <textarea id="postponeReason" class="form-control" 
                                  rows="3" placeholder="Укажите причину откладывания..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal>Отмена</button>
                <button type="button" id="confirmPostponeBtn" class="btn btn-primary">Отложить</button>
            </div>
        </div>
    </div>

    <!-- Инициализация -->
    <script type="module">
        import { HeaderManager } from './JS/core/header-manager.js';
        import { SidebarManager } from './JS/core/sidebar-manager.js';
        import { NotificationManager } from './JS/notification/notification-manager.js';
        import { getState, setState } from './JS/notification/notification-state.js';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Инициализация заголовка
                await HeaderManager.init();
                
                // Инициализация сайдбара (внутри вызывает NotificationManager.init())
                SidebarManager.init();
                
                // Получаем менеджер (уже инициализирован через SidebarManager)
                const manager = NotificationManager.getInstance();
                
                // ВАЖНО: Сначала устанавливаем фильтр
                setState({ currentFilter: 'active', currentPage: 1 });
                
                // Активируем кнопку Active
                document.querySelectorAll('.filters .btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                const activeBtn = document.querySelector('[data-filter="active"]');
                if (activeBtn) {
                    activeBtn.classList.add('active');
                }
                
                // Настраиваем обработчики событий интерфейса
                manager.setupEventListeners();
                
                // Загружаем уведомления
                await manager.loadNotifications(true);
                
                // Проверяем какой фильтр после загрузки
                const stateAfter = getState();
                
            } catch (error) {
                console.error('[Notifications] Ошибка инициализации страницы:', error);
            }
        });
    </script>
</body>
</html>
