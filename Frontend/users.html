<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи - Granitka71</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/orders.css">
    <link rel="stylesheet" href="CSS/modals.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Дашборд</a>
            <a href="orders.html" class="nav-item">Заказы</a>
            <a href="create-order.html" class="nav-item">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item">Архив</a>
            <a href="users.html" class="nav-item active admin-only">Пользователи</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Пользователи</h1>
                <div></div>
            </div>

            <form id="createUserForm">
                <div class="form-group">
                    <label for="newUsername">Логин *</label>
                    <input type="text" id="newUsername" required placeholder="username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="newPassword">Пароль *</label>
                    <input type="password" id="newPassword" required placeholder="минимум 6 символов" minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="newFullName">ФИО *</label>
                    <input type="text" id="newFullName" required placeholder="ФИО" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="newRole">Роль *</label>
                    <select id="newRole" required>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Создать</button>
                <div id="userFormError" class="error-message"></div>
                <div id="userFormSuccess" class="success-message"></div>
            </form>

            <div class="orders-table-container">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>ФИО</th>
                            <th>Роль</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
                <!-- Модальное окно редактирования пользователя -->
                <div id="editUserModal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3 id="editUserModalTitle" class="modal-title">Редактировать пользователя</h3>
                            <button class="close">&times;</button>
                        </div>
                        
                        <form id="editUserForm" class="modal-form">
                            <div class="form-group">
                                <label for="editUsername">Логин *</label>
                                <input type="text" id="editUsername" required autocomplete="username">
                            </div>
                            
                            <div class="form-group">
                                <label for="editFullName">ФИО *</label>
                                <input type="text" id="editFullName" required autocomplete="name">
                            </div>
                            
                            <div class="form-group">
                                <label for="editPassword">Новый пароль</label>
                                <input type="password" id="editPassword" placeholder="Оставьте пустым, чтобы не менять" autocomplete="new-password" minlength="6">
                                <small>Минимум 6 символов</small>
                            </div>
                            
                            <div class="form-group">
                                <label>Текущая роль: <span id="currentRole" class="role-badge"></span></label>
                            </div>
                            
                            <div class="modal-actions">
                                <button type="button" class="btn btn-outline" id="cancelEditBtn">Отмена</button>
                                <button type="submit" class="btn btn-primary">Сохранить</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/users.js"></script>
</body>
</html>
