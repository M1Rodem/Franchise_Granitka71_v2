<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/auth.css">
</head>
<body>
    <div class="login-container">
        <main class="login-form card" role="main" aria-labelledby="login-title">
            <div class="logo">
                <h1 id="login-title">Granitka71</h1>
                <p>Система управления заказами</p>
            </div>
            
            <form id="loginForm" aria-describedby="error-container">
                <div class="form-group">
                    <label for="username">Логин:</label>
                    <input type="text" id="username" name="username" required autocomplete="username" aria-describedby="username-help">
                    <small id="username-help" class="sr-only">Введите ваш логин</small>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" aria-describedby="password-help">
                    <small id="password-help" class="sr-only">Введите ваш пароль</small>
                </div>
                
                <div id="error-container" class="error-message sr-only" role="alert" aria-live="polite"></div>
                
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
        </main>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
