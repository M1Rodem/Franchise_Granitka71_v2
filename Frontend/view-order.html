<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр заказа - Granitka71</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="./CSS/base/reset.css">
    <link rel="stylesheet" href="./CSS/base/variables.css">
    <link rel="stylesheet" href="./CSS/base/utilities.css">
    <link rel="stylesheet" href="./CSS/base/typography.css">
    
    <!-- Layout -->
    <link rel="stylesheet" href="./CSS/layout/header.css">
    <link rel="stylesheet" href="./CSS/layout/sidebar.css">
    <link rel="stylesheet" href="./CSS/layout/main-content.css">
    
    <!-- Components -->
    <link rel="stylesheet" href="./JS/notification/notification-fix.css">
    <link rel="stylesheet" href="./CSS/components/buttons.css">
    <link rel="stylesheet" href="./CSS/components/forms.css">
    <link rel="stylesheet" href="./CSS/components/tables.css" onerror="console.error('Failed to load tables.css')">
    <link rel="stylesheet" href="./CSS/components/cards.css">
    <link rel="stylesheet" href="./CSS/components/modals.css">
    <link rel="stylesheet" href="./CSS/components/toasts.css">
    <link rel="stylesheet" href="./CSS/components/loading.css">
    
    <!-- Pages -->
    <link rel="stylesheet" href="./CSS/pages/view-order.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <button id="burgerBtn" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">
                    ☰
                </button>
                <a href="dashboard.html"><h1>Granitka71</h1></a>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти из аккаунта">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item" data-page="orders">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="notifications.html" class="nav-item" data-page="notifications">
                Уведомления&nbsp;
                <span id="notificationsBadge" class="badge" style="display: none;">0</span>
            </a>
            <a href="users.html" class="nav-item admin-only" data-page="users" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <div class="page-header">
                <h1>Просмотр заказа</h1>
                <div class="page-header-actions">
                    <a href="orders.html" class="btn btn-outline back-btn">← Назад</a>
                    <button id="printBtn" class="btn btn-primary print-btn">Печать</button>
                    <button id="excelBtn" class="btn btn-success">Excel</button>
                </div>
            </div>

            <div id="loadingSpinner" class="loading-spinner" role="status" aria-live="polite">Загрузка...</div>

            <div id="orderContainer" class="order-container" role="region" aria-label="Детали заказа">
                <!-- Основные детали (рендерятся в #orderView) -->
                <div id="orderView" class="order-view card" aria-labelledby="order-header">
                    <!-- JS вставит сюда детали заказа -->
                </div>

                <!-- Работы (accordion для компактности и мобильности) -->
                <details class="accordion-section" open>
                    <summary class="accordion-summary">Работы по заказу</summary>
                    <div id="workItemsContainer" class="section-content table-container" role="region" aria-label="Список работ">
                        <p class="no-data">Нет работ</p>
                    </div>
                </details>

                <!-- Платежи -->
                <details class="accordion-section" open>
                    <summary class="accordion-summary">Платежи</summary>
                    <div id="paymentsContainer" class="section-content table-container" role="region" aria-label="Список платежей">
                        <p class="no-data">Нет платежей</p>
                    </div>
                </details>

                <!-- Фото (открыто по умолчанию) -->
                <details class="accordion-section photo-accordion" open>
                    <summary class="accordion-summary">Фотографии</summary>
                    <div id="orderPhotos" class="photo-preview section-content" role="region" aria-label="Галерея фотографий">
                        Нет фотографий
                    </div>
                </details>

                <div class="action-buttons">
                    <button id="editBtn" class="btn btn-primary" aria-label="Редактировать заказ">Редактировать</button>
                    <button id="deleteBtn" class="btn btn-danger" aria-label="Удалить заказ">Удалить</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { SidebarManager } from './js/core/sidebar-manager.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            SidebarManager.init();
        });
    </script>
    <script type="module" src="./js/pages/view-order.js"></script>
</body>
</html>
