<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/orders.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти из аккаунта">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item active" data-page="orders" aria-current="page">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="users.html" class="nav-item admin-only" data-page="users" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <div class="page-header">
                <h1>Управление заказами</h1>
                <a href="create-order.html" class="btn btn-primary" aria-label="Создать новый заказ">Новый заказ</a>
            </div>

            <!-- Фильтры -->
            <form class="filters" id="filtersForm" aria-label="Фильтры заказов">
                <input type="text" id="searchInput" placeholder="Поиск по номеру, имени, телефону..." class="search-input" data-filter="search">
                <select id="statusFilter" class="filter-select" data-filter="status">
                    <option value="all">Все статусы</option>
                    <option value="not_paid">Не оплачено</option>
                    <option value="partial">Частично оплачено</option>
                    <option value="paid">Оплачено</option>
                    <option value="overpaid">Переплачено</option>
                </select>
                <button type="button" id="applyFilters" class="btn btn-primary">Применить</button>
                <button type="button" id="resetFilters" class="btn btn-outline">Сбросить</button>
            </form>

            <!-- Таблица -->
            <div class="orders-table-container">
                <table class="orders-table" role="table" aria-label="Список заказов">
                    <thead>
                        <tr>
                            <th scope="col">№ Заказа</th>
                            <th scope="col">Клиент</th>
                            <th scope="col">Телефон</th>
                            <th scope="col">Дата</th>
                            <th scope="col">Сумма</th>
                            <th scope="col">Статус оплаты</th>
                            <th scope="col">Менеджер</th>
                            <th scope="col">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="skeleton">
                        <!-- Skeleton via CSS -->
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <nav class="pagination" role="navigation" aria-label="Пагинация">
                <button id="prevPage" class="btn" disabled>← Назад</button>
                <span id="pageInfo" aria-live="polite">Страница 1 из 1</span>
                <button id="nextPage" class="btn" disabled>Вперед →</button>
            </nav>
        </div>
    </main>

    <script type="module" src="js/orders.js"></script>
</body>
</html>
