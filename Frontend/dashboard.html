<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления - Granitka71</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="./CSS/base/reset.css">
    <link rel="stylesheet" href="./CSS/base/variables.css">
    <link rel="stylesheet" href="./CSS/base/utilities.css">
    
    <!-- Layout -->
    <link rel="stylesheet" href="./CSS/layout/header.css">
    <link rel="stylesheet" href="./CSS/layout/sidebar.css">
    <link rel="stylesheet" href="./CSS/layout/main-content.css">
    
    <!-- Components -->
    <link rel="stylesheet" href="./JS/notification/notification-fix.css">
    <link rel="stylesheet" href="./CSS/components/buttons.css">
    <link rel="stylesheet" href="./CSS/components/forms.css">
    <link rel="stylesheet" href="./CSS/components/tables.css">
    <link rel="stylesheet" href="./CSS/components/cards.css">
    <link rel="stylesheet" href="./CSS/components/modals.css">
    
    <!-- Pages -->
    <link rel="stylesheet" href="./CSS/pages/dashboard.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <button id="burgerBtn" class="burger-btn" aria-label="Открыть меню" aria-expanded="false">
                    ☰
                </button>
                <a href="dashboard.html"><h1>Granitka71</h1></a>
                <div class="user-info">
                    <a href="profile.html" id="userName" class="user-profile-link" aria-label="Перейти в профиль">Пользователь</a>
                    <button id="logoutBtn" class="btn btn-outline" aria-label="Выйти из аккаунта">Выйти</button>
                </div>
            </div>
        </div>
    </header>

        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Основное меню">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">Дашборд</a>
            <a href="orders.html" class="nav-item" data-page="orders">Заказы</a>
            <a href="create-order.html" class="nav-item" data-page="create">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item" data-page="archived">Архив</a>
            <a href="notifications.html" class="nav-item" data-page="notifications">
                Уведомления&nbsp;
                <span id="notificationsBadge" class="badge" style="display: none;">0</span>
            </a>
            <a href="admin.html" class="nav-item admin-only" data-page="admin" style="display: none;">Админ-панель</a>
        </div>
    </nav>

    <main class="main-content" id="mainContent" role="main">
        <div class="container">
            <section class="dashboard-stats" aria-labelledby="stats-heading">
                <h2 id="stats-heading" class="sr-only">Статистика заказов</h2>
                
                <!-- Карточка "Всего заказов" с кликом на orders.html -->
                <div class="stat-card skeleton clickable-stat-card" data-type="total" data-filter="all" role="button" aria-label="Перейти к списку всех заказов" tabindex="0">
                    <h3>Всего заказов</h3>
                    <div class="stat-number skeleton-text" id="totalOrders">0</div>
                </div>
                
                <!-- Карточка "Аванс" с кликом на orders.html с фильтром -->
                <div class="stat-card skeleton clickable-stat-card" data-type="unpaid" data-filter="unpaid" role="button" aria-label="Перейти к списку неоплаченных заказов" tabindex="0">
                    <h3>Аванс</h3>
                    <div class="stat-number skeleton-text" id="unpaidOrders">0</div>
                </div>
                
                <!-- Карточка "За сегодня" с кликом на orders.html с фильтром по дате -->
                <div class="stat-card skeleton clickable-stat-card" data-type="today" data-filter="today" role="button" aria-label="Перейти к списку заказов за сегодня" tabindex="0">
                    <h3>За сегодня</h3>
                    <div class="stat-number skeleton-text" id="todayOrders">0</div>
                </div>
            </section>
            <section class="recent-orders" aria-labelledby="recent-heading">
                <h2 id="recent-heading">Последние заказы</h2>
                <div id="recentOrdersList" class="orders-list skeleton">
                    <!-- Skeleton rows via CSS -->
                </div>
                <div id="noRecentOrders" class="no-data" style="display: none;">
                    <p>Нет недавних заказов</p>
                    <a href="create-order.html" class="cta" aria-label="Создать новый заказ">Создать первый</a>
                </div>
            </section>
        </div>
    </main>
    <script type="module" src="./js/pages/dashboard.js"></script>
</body>
</html>
