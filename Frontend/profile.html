<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Granitka71</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/orders.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1>Granitka71</h1>
                <div class="user-info">
                    <span id="userName">Пользователь</span>
                    <button id="logoutBtn" class="btn btn-outline">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Дашборд</a>
            <a href="orders.html" class="nav-item">Заказы</a>
            <a href="create-order.html" class="nav-item">Создать заказ</a>
            <a href="archived-orders.html" class="nav-item">Архив</a>
            <a href="users.html" class="nav-item admin-only" style="display: none;">Пользователи</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Профиль</h1>
                <a href="dashboard.html" class="btn btn-outline">← Назад</a>
            </div>

            <div id="profileInfo" class="card" style="padding: 1rem;">
                <p><strong>Логин:</strong> <span id="username"></span> (readonly)</p>
                <p><strong>ФИО:</strong> <input id="fullName" type="text"></p>
                <p><strong>Роль:</strong> <span id="role"></span> (readonly)</p>
                <button id="updateProfileBtn" class="btn btn-primary">Сохранить ФИО</button>
            </div>

            <div id="changePasswordSection" class="card" style="padding: 1rem; margin-top: 1rem;">
                <h2>Сменить пароль</h2>
                <div class="form-group">
                    <label for="currentPassword">Текущий пароль</label>
                    <input id="currentPassword" type="password" placeholder="Текущий пароль">
                </div>
                <div class="form-group">
                    <label for="newPassword">Новый пароль</label>
                    <input id="newPassword" type="password" placeholder="Новый пароль (мин. 6 символов)">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Подтвердить пароль</label>
                    <input id="confirmPassword" type="password" placeholder="Подтвердить пароль">
                </div>
                <button id="changePasswordBtn" class="btn btn-primary">Сменить пароль</button>
            </div>

            <div id="profileError" class="error-message"></div>
            <div id="profileSuccess" class="success-message"></div>
        </div>
    </main>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
